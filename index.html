<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rahhal — Parlons de votre prochain voyage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;font-family:Arial,Helvetica,sans-serif}
.page{position:relative;width:calc(100% - 6px);max-width:946px;margin:0 auto;background:#fff;line-height:0}
.page img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;display:block;background:transparent;border:0;padding:0;margin:0;cursor:pointer;line-height:normal;z-index:100;pointer-events:auto!important;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.start-hit{left:8%;top:65.8%;width:84%;height:5%;z-index:101}
.menu-hit{right:.5%;top:78.7%;width:12.5%;height:4.8%;border-radius:50%;z-index:102}
.drawer{position:fixed;inset:0;z-index:1000;visibility:hidden;pointer-events:none;line-height:normal}
.drawer.open{visibility:visible;pointer-events:auto}
.drawer-bg{position:absolute;inset:0;background:rgba(4,18,31,.48);backdrop-filter:blur(3px);opacity:0;transition:.25s}
.drawer.open .drawer-bg{opacity:1}
.drawer-panel{position:absolute;top:0;right:0;width:min(390px,88%);height:100%;background:#fff;box-shadow:-15px 0 45px rgba(0,0,0,.2);padding:30px;transform:translateX(100%);transition:.3s ease;display:flex;flex-direction:column}
.drawer.open .drawer-panel{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.drawer-head strong{font-size:23px;letter-spacing:1px;color:#102c50}
.close{border:0;background:#eef2f5;width:38px;height:38px;border-radius:50%;font-size:22px;color:#102c50;cursor:pointer}
.drawer-links{display:grid;gap:12px}
.drawer-link{display:block;text-decoration:none;color:#102c50;padding:18px 16px;border:1px solid #dce4ec;border-radius:12px;font-size:15px;font-weight:700}
.drawer-link small{display:block;color:#74859a;font-weight:400;font-size:11px;margin-top:5px}
.drawer-note{margin-top:auto;color:#8a99a9;font-size:11px;line-height:1.5}
</style>
</head>
<body>
<main class="page">
<img src="./assets/IMG_2970.jpeg" alt="Rahhal Voyage">
<a class="hit start-hit" href="./form-v2.html" aria-label="Commencer le questionnaire" onclick="window.location.assign('./form-v2.html');return false;"></a>
<button type="button" class="hit menu-hit" id="menuBtn" aria-label="Ouvrir le menu"></button>
</main>
<div class="drawer" id="drawer">
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer-panel">
<div class="drawer-head"><strong>Menu</strong><button type="button" class="close" id="closeBtn" aria-label="Fermer">×</button></div>
<div class="drawer-links">
<a class="drawer-link" href="./qui-sommes-nous.html">Qui sommes-nous ?<small>Découvrez Rahhal et notre accompagnement</small></a>
<a class="drawer-link" href="./catalogue.html">Idées de voyages<small>Destinations et inspirations pour votre prochain départ</small></a>
<a class="drawer-link" href="./contact.html">Contact<small>Une question ? Écrivez-nous</small></a>
</div>
<div class="drawer-note">Rahhal est un outil de prospection. Les réservations, paiements et contrats sont réalisés directement sur la plateforme iCliGo.</div>
</aside>
</div>
<script>
(function(){
const drawer=document.getElementById('drawer');
const menuBtn=document.getElementById('menuBtn');
const closeBtn=document.getElementById('closeBtn');
const drawerBg=document.getElementById('drawerBg');
function openMenu(e){if(e){e.preventDefault();e.stopPropagation();}drawer.classList.add('open');}
function closeMenu(e){if(e){e.preventDefault();e.stopPropagation();}drawer.classList.remove('open');}
menuBtn.onclick=openMenu;
menuBtn.ontouchend=openMenu;
closeBtn.onclick=closeMenu;
drawerBg.onclick=closeMenu;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
})();
</script>
</body>
</html>
