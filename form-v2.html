<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAHHAL — Votre projet de voyage</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#10252b;--green:#063f3b;--gold:#c99b4a;--cream:#f8f6f1;--white:#fff;--muted:#687875;--line:rgba(16,37,43,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif;color:var(--ink)}body{background:var(--cream)}.page{min-height:100vh;padding:28px 18px 55px;background:linear-gradient(rgba(6,63,59,.12),rgba(6,63,59,.12)),url('./IMG_5491.jpeg') center/cover fixed no-repeat}.wrap{width:min(900px,100%);margin:auto}.head{display:flex;align-items:center;justify-content:center;margin:0 0 22px}.brand{text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}.brand h1{font-family:'Playfair Display',serif;font-size:38px;line-height:1;margin:0;font-weight:600;letter-spacing:.08em}.brand p{font-size:9px;line-height:1.2;letter-spacing:.28em;margin:7px 0 0}.card{background:rgba(248,246,241,.98);border:1px solid rgba(255,255,255,.55);border-radius:2px;padding:38px 42px 44px;box-shadow:0 22px 65px rgba(16,37,43,.24);overflow:hidden}.back{display:inline-block;color:var(--green);text-decoration:none;font-size:12px;font-weight:600;margin-bottom:20px;transition:.2s}.back:hover{color:var(--gold)}.intro{text-align:center;max-width:650px;margin:0 auto}.intro h2{font-family:'Playfair Display',serif;color:var(--green);margin:0 0 8px;font-size:34px;font-weight:600}.sub{margin:0 0 25px;color:var(--muted);font-size:14px}.progress{height:4px;background:#ddd9d0;border-radius:99px;margin:0 0 32px;overflow:hidden}.progress i{display:block;height:100%;width:10%;background:var(--gold);border-radius:99px;transition:width .35s}.slide{display:none;animation:in .32s ease}.slide.active{display:block}@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}.question{font-family:'Playfair Display',serif;color:var(--green);font-size:27px;line-height:1.2;text-align:center;margin:4px 0 9px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:0 0 22px}.grid{display:grid;gap:12px}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.opt input{position:absolute;opacity:0}.opt label{display:flex;align-items:center;justify-content:center;min-height:58px;text-align:center;border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer;padding:10px;font-weight:600;font-size:12px;color:var(--ink);transition:.2s}.opt label:hover{border-color:var(--gold);transform:translateY(-1px)}.opt input:checked+label{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 7px 18px rgba(6,63,59,.16)}.climate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.climate-option{position:relative}.climate-option input{position:absolute;opacity:0}.climate-option label{display:block;position:relative;height:165px;border:2px solid transparent;border-radius:2px;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;box-shadow:0 7px 20px rgba(16,37,43,.12);transition:.22s}.climate-option label:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,63,59,0),rgba(6,63,59,.72))}.climate-option span{position:absolute;z-index:1;left:14px;right:14px;bottom:13px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 5px rgba(0,0,0,.45)}.climate-option input:checked+label{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 9px 24px rgba(6,63,59,.2)}.climate-option input:checked+label:before{content:'✓';position:absolute;z-index:2;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.field{margin-top:14px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:7px;color:var(--green)}input,textarea{width:100%;border:1px solid var(--line);border-radius:2px;padding:12px;background:#fff;color:var(--ink);font:inherit;font-size:13px;outline:none}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,155,74,.12)}input[type=range]{padding:0;border:0;accent-color:var(--gold)}.duration{text-align:center;font-family:'Playfair Display',serif;font-weight:600;color:var(--green);font-size:17px;margin-top:9px}.actions{display:flex;gap:11px;margin-top:24px}.btn{flex:1;border:1px solid var(--green);border-radius:999px;background:var(--green);color:#fff;padding:13px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}.btn:hover{background:#0a514b;transform:translateY(-1px)}.btn.secondary{background:transparent;color:var(--green);border-color:var(--line)}.btn.secondary:hover{border-color:var(--gold);color:var(--gold);background:transparent}.hidden{display:none!important}.contact-check{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer;font-weight:600;font-size:13px}.contact-check input{width:auto;accent-color:var(--green)}.summary{background:#fff;border:1px solid var(--line);border-radius:2px;padding:17px;margin:0 0 20px}.summary h4{font-family:'Playfair Display',serif;color:var(--green);margin:0 0 12px;font-size:18px;text-align:center}.summary-row{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px solid rgba(16,37,43,.08);font-size:12px}.summary-row:last-child{border-bottom:0}.summary-label{font-weight:700;color:var(--green)}.summary-value{text-align:right;color:var(--muted)}.success,.error{display:none;margin-top:13px;padding:11px;border-radius:2px;font-weight:700;text-align:center;font-size:12px}.success{background:#e2eee8;color:#24543b}.error{background:#f6e3df;color:#8c2c2c}.note{text-align:center;color:var(--muted);font-size:10px;margin:12px 0 0}@media(max-width:700px){.page{padding:12px 7px 25px;background-attachment:scroll}.head{margin-bottom:13px}.brand h1{font-size:29px}.card{padding:25px 15px 28px;border-radius:2px}.intro h2{font-size:27px}.sub{font-size:12px}.progress{margin-bottom:25px}.question{font-size:22px}.hint{font-size:11px}.grid3{grid-template-columns:1fr 1fr}.opt label{min-height:52px;font-size:11px}.climate-grid{grid-template-columns:1fr 1fr;gap:9px}.climate-option label{height:125px}.climate-option span{font-size:11px;left:9px;right:9px;bottom:9px}.actions{margin-top:18px}.btn{font-size:12px;padding:12px}.summary-row{font-size:11px}}@media(max-width:390px){.opt label{font-size:10px;min-height:48px}.climate-option label{height:108px}.climate-option span{font-size:10px}}</style></head><body><div id="app"><div style="text-align:center;padding:40px;font-family:Arial;color:#063f3b">Chargement de votre projet de voyage…</div></div><script>(async()=>{const source='https://raw.githubusercontent.com/bilal67-create/Rahhal-voyage/11a7a0eef0b302e135b4fba59e26da86a52d9c2a/form-v2.html';try{const r=await fetch(source);if(!r.ok)throw new Error('load');const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');document.getElementById('app').replaceWith(...[...doc.body.children].filter(e=>e.tagName!=='SCRIPT').map(e=>e.cloneNode(true)));[...doc.scripts].forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;document.body.appendChild(s);});}catch(e){document.getElementById('app').innerHTML='<div style="text-align:center;padding:40px;font-family:Arial;color:#8c2c2c">Le questionnaire n’a pas pu être chargé. Veuillez réessayer.</div>';}})();</script></body></html>
