name: Apply fresh image
on:
  push:
    paths:
      - '.github/workflows/temporary-fresh-image.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('form-v2.html')
          s=p.read_text()
          old='https://commons.wikimedia.org/wiki/Special:FilePath/Cherry-blossom-japan_(Unsplash).jpg'
          new='https://images.openai.com/static-rsc-4/Xcue_c2uYbeux63E_MqSE9OY_1CGQRd0kQYspCGLb_8MwYLZ4bfl0_5RrFDpi6iJGTK6ND7bJH13g4jXrOvyOXKg2vbTqmNArGIc_WzHj_t36TDheQ1Y3pgAgbSRlQ_AQlN6gRKMlpH0_Eq_DmS2oRFVv9QSm1fBE_doM-_b3KmAZYY6NeDAHEwy783z1xSg?purpose=fullsize'
          if old not in s: raise SystemExit('old image URL not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add form-v2.html
          git commit -m 'Update Frais image' || true
          git push
          rm .github/workflows/temporary-fresh-image.yml
          git add .github/workflows/temporary-fresh-image.yml
          git commit -m 'Remove temporary image workflow'
          git push
