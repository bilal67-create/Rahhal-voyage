name: RAHHAL image fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'RAHHAL spring image fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only the Frais / doux image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('form-v2.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('value="Printemps / fleurs"', 'value="Frais / doux"')
          s = s.replace('<span>🌸 Printemps / fleurs</span>', '<span>🌿 Frais / doux</span>')
          s = s.replace("https://images.unsplash.com/photo-1522383225653-ed111181a951?auto=format&fit=crop&w=700&q=80", "https://commons.wikimedia.org/wiki/Special:FilePath/Cherry-blossom-japan_(Unsplash).jpg")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit the change and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add form-v2.html .github/workflows/ra\ hhal-image-fix.yml
          git rm .github/workflows/ra\ hhal-image-fix.yml
          git commit -m "RAHHAL spring image fix"
          git push
