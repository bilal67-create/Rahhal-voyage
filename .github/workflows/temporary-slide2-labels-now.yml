name: Temporary Slide 2 Labels
on:
  push:
    paths:
      - '.github/workflows/temporary-slide2-labels-now.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('form-v2.html')
          s=p.read_text()
          reps={
            'value="Neige / froid"':'value="Neige"',
            '<span>❄️ Neige / froid</span>':'<span>❄️ Neige</span>',
            'value="Très chaud"':'value="Désertique"',
            '<span>☀️ Très chaud</span>':'<span>☀️ Désertique</span>',
            'value="Frais / doux"':'value="Frais"',
            '<span>🌿 Frais / doux</span>':'<span>🌿 Frais</span>',
            'value="Plage / soleil"':'value="Paradisiaque"',
            '<span>🏖️ Plage / soleil</span>':'<span>🏖️ Paradisiaque</span>'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add form-v2.html
          git diff --cached --quiet || git commit -m 'Update slide 2 climate labels'
          rm -f .github/workflows/temporary-slide2-labels-now.yml
          git add .github/workflows/temporary-slide2-labels-now.yml
          git commit -m 'Remove temporary slide 2 workflow' || true
          git push
